
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <header>
            <h1>My Task Manager</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <form action="/add" method="POST" class="task-form">
            <input type="text" name="task" placeholder="Enter a new task..." required>
            <button type="submit">Add Task +</button>
        </form>

        <div class="task-list">
            <h2>My Tasks</h2>

            {% if tasks %}
                {% for task in tasks %}
                <div class="task-item">
                    <span class="{{ 'completed' if task.completed else '' }}">
                        {{ task.name }}
                    </span>

                    <div class="actions">
                        <a href="{{ url_for('complete_task', task_id=loop.index0) }}">
                            {{ 'Undo' if task.completed else 'Complete' }}
                        </a>

                        <a href="{{ url_for('delete_task', task_id=loop.index0) }}"
                           class="delete">Delete</a>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <p class="empty">No tasks yet. Add your first task!</p>
            {% endif %}
        </div>

        <footer>
            <p>Stay organized. Stay productive.</p>
        </footer>
    </div>

</body>
</html>
